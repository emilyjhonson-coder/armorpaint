name: ArmorPaint Cloud Build

on:
  workflow_dispatch: # This enables the manual "Run workflow" button

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/actions-setup-node@v4
      with:
        node-version: 18

    - name: Generate Visual Studio Solution
      run: |
        cd paint
        ..\base\make.bat

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Compile Release Build
      run: |
        msbuild paint/build/ArmorPaint.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload Finished Executable
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-Windows-CloudBuild
        path: paint/build/x64/Release/ArmorPaint.exe
